name: Release production

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify stable release ancestry
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: bun scripts/verify-release.ts

  quality:
    name: Release quality
    needs: verify
    uses: ./.github/workflows/quality.yml

  review:
    name: Release model review
    needs: verify
    uses: ./.github/workflows/model-review.yml
    secrets:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

  deploy:
    name: Deploy verified release
    needs: [verify, quality, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://eduardo-lopez.com
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Verify ancestry again before deployment
        run: bun scripts/verify-release.ts
      - name: Install the pinned deployment CLI
        run: |
          mkdir -p "$RUNNER_TEMP/vercel-cli"
          bun add --cwd "$RUNNER_TEMP/vercel-cli" --ignore-scripts --exact vercel@62.2.0
      - name: Validate deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bun -e 'for (const name of ["VERCEL_TOKEN", "VERCEL_ORG_ID", "VERCEL_PROJECT_ID"]) { if (!process.env[name]) throw new Error(`Missing ${name}`); }'
      # CLI 62.2.0 reads process.env.VERCEL_TOKEN when no token argument is given.
      - name: Verify deployment authentication
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: '"$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" whoami > /dev/null'
      - name: Deploy release source and wait for completion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: '"$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" deploy --prod --yes --no-color --build-env "RELEASE_COMMIT=$GITHUB_SHA"'
      - name: Verify the deployed release commit
        run: bun scripts/check-production.ts
      - name: Verify the public resume API
        run: |
          bun -e '
            const response = await fetch("https://eduardo-lopez.com/api/resume?lang=en&version=founder", { signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error(`Production API returned HTTP ${response.status}`);
            const resume = await response.json();
            if (resume.meta?.language !== "en" || resume.meta?.version !== "founder") throw new Error("Production API returned the wrong resume variant.");
            console.log("Production resume API passed.");
          '
